<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARIA · OG card artboard (1200×630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  /* Export: screenshot the artboard at exactly 1200×630 (1x) or 2400×1260 (2x)
     → public/og.png. Also the design reference for the §15a generated variant. */
  body { margin:0; background:#1a1d26; display:grid; place-items:center; min-height:100vh; font-family:var(--font-display); }
  .artboard {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(540px 360px at 78% 30%, rgba(22,135,255,0.16), transparent 65%),
      radial-gradient(420px 300px at 16% 78%, rgba(139,92,246,0.14), transparent 65%),
      radial-gradient(760px 500px at 50% 45%, #0a0e1a, #04060d 75%);
  }
  /* starfield */
  .stars, .stars::after { position:absolute; inset:0; }
  .stars::after { content:"";
    background-image:
      radial-gradient(1.5px 1.5px at 8% 18%, rgba(234,246,255,.9) 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 70%, rgba(234,246,255,.55) 50%, transparent 51%),
      radial-gradient(2px 2px at 38% 28%, rgba(99,245,255,.8) 50%, transparent 51%),
      radial-gradient(1px 1px at 52% 82%, rgba(234,246,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 67% 14%, rgba(167,139,250,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 80% 60%, rgba(234,246,255,.6) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 91% 38%, rgba(56,189,248,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 13% 44%, rgba(234,246,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 50%, rgba(234,246,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 33% 90%, rgba(99,245,255,.5) 50%, transparent 51%);
  }
  /* galaxy nodes, right side */
  .gal { position:absolute; right:0; top:0; width:560px; height:630px; }
  .gal svg { width:100%; height:100%; }
  .hub { filter: drop-shadow(0 0 18px rgba(99,245,255,0.6)); }
  /* content */
  .content { position:absolute; left:72px; top:0; bottom:0; width:600px; display:flex; flex-direction:column; justify-content:center; gap:28px; }
  .brand { display:flex; align-items:center; gap:14px; color:#eaf6ff; font-weight:700; letter-spacing:0.3em; font-size:22px; }
  .brand .mark { width:30px; height:30px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #bffaff, #63f5ff 45%, rgba(22,135,255,0.25) 80%);
    box-shadow: 0 0 24px rgba(99,245,255,0.8); }
  .brand small { font-family: var(--font-mono); font-weight:500; font-size:11px; letter-spacing:0.2em; color:#5f7184; display:block; }
  h1 { margin:0; color:#eaf6ff; font-size:54px; line-height:1.1; letter-spacing:-0.02em; font-weight:600; }
  h1 em { font-style:normal; color:#63f5ff; }
  .sub { font-family: var(--font-mono); font-size:15px; letter-spacing:0.14em; text-transform:uppercase; color:#9fb3c7; }
  .chips { display:flex; gap:12px; }
  .chip { font-family:var(--font-mono); font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    padding:7px 14px; border-radius:4px; border:1px solid; }
  .chip.c1 { color:#2dd4bf; border-color:rgba(45,212,191,.5); background:rgba(45,212,191,.08); }
  .chip.c2 { color:#a78bfa; border-color:rgba(167,139,250,.5); background:rgba(167,139,250,.08); }
  .chip.c3 { color:#63f5ff; border-color:rgba(99,245,255,.5); background:rgba(99,245,255,.08); }
  .domain { position:absolute; left:72px; bottom:40px; font-family:var(--font-mono); font-size:14px; letter-spacing:0.18em; color:#5f7184; text-transform:uppercase; }
</style>
</head>
<body>
<div class="artboard">
  <div class="stars"></div>
  <div class="gal" aria-hidden="true">
    <svg viewBox="0 0 560 630">
      <g fill="none" stroke="rgba(99,245,255,0.18)" stroke-dasharray="3 7">
        <path d="M130,180 Q260,260 300,330"/>
        <path d="M450,150 Q380,250 300,330"/>
        <path d="M150,480 Q230,410 300,330"/>
        <path d="M460,500 Q390,420 300,330"/>
        <path d="M130,180 Q300,60 450,150"/>
      </g>
      <g class="hub">
        <circle cx="300" cy="330" r="34" fill="rgba(99,245,255,0.95)"/>
        <circle cx="300" cy="330" r="58" fill="none" stroke="rgba(99,245,255,0.5)"/>
        <circle cx="300" cy="330" r="86" fill="none" stroke="rgba(99,245,255,0.18)"/>
      </g>
      <circle cx="130" cy="180" r="15" fill="rgba(255,200,87,0.9)"/>
      <circle cx="450" cy="150" r="13" fill="rgba(22,135,255,0.9)"/>
      <circle cx="150" cy="480" r="13" fill="rgba(255,61,129,0.9)"/>
      <circle cx="460" cy="500" r="15" fill="rgba(56,189,248,0.9)"/>
      <circle cx="495" cy="305" r="10" fill="rgba(167,139,250,0.9)"/>
    </svg>
  </div>
  <div class="content">
    <div class="brand"><span class="mark"></span><span>ARIA<small>Autonomous Resilience Intelligence Architecture</small></span></div>
    <h1>The autonomous security analyst you can <em>actually trust</em> to act.</h1>
    <div class="sub">Voice-native · Governed autonomy · AI-SPM</div>
    <div class="chips"><span class="chip c1">AI-SPM</span><span class="chip c2">Trust ladder</span><span class="chip c3">90-sec demo</span></div>
  </div>
  <div class="domain">aria-sec.com</div>
</div>
</body>
</html>
