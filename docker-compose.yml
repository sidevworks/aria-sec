# Local container stack for the Aria server. Requires a credential encryption key:
#
#   export ARIA_CREDENTIAL_ENCRYPTION_KEY=$(node scripts/generate-encryption-key.mjs)
#   docker compose up
#
# The image runs with NODE_ENV=production, which is deliberately fail-closed — it
# refuses to boot without that key rather than silently writing connector
# credentials to disk in plaintext.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: ${ARIA_POSTGRES_PASSWORD:-aria_local_dev}
      POSTGRES_DB: aria_guardian
    ports:
      # Loopback-bound: this is a development database with a default password
      # and must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - aria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria -d aria_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARIA_DATABASE_URL: postgres://aria:${ARIA_POSTGRES_PASSWORD:-aria_local_dev}@postgres:5432/aria_guardian
      ARIA_DATABASE_SSL: "false"
      ARIA_PERSISTENCE_DIR: /data/aria-memory
      ARIA_PORT: "5000"
      # 0.0.0.0 binds inside the container's namespace only; the published port
      # below is what controls host exposure.
      ARIA_HOST: "0.0.0.0"
      # Required. Compose fails fast with this message if it is unset.
      ARIA_CREDENTIAL_ENCRYPTION_KEY: ${ARIA_CREDENTIAL_ENCRYPTION_KEY:?set this to a 64-char hex key - generate one with "node scripts/generate-encryption-key.mjs"}
      # Optional BYOK passthrough. For a local engine running on the host rather
      # than in a container, use http://host.docker.internal:11434/v1.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY_V2: ${GEMINI_API_KEY_V2:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ARIA_LOCAL_LLM_URL: ${ARIA_LOCAL_LLM_URL:-}
      ARIA_LOCAL_LLM_MODEL: ${ARIA_LOCAL_LLM_MODEL:-}
    ports:
      # Loopback-bound: the Aria API is not designed to face the internet.
      - "127.0.0.1:5000:5000"
    volumes:
      - aria_persistence_data:/data/aria-memory
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/aria/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  aria_postgres_data:
  aria_persistence_data:
