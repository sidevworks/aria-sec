name: ARIA quality gate

on:
  push: {}
  pull_request:

permissions:
  contents: read

concurrency:
  group: aria-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --quiet
      - run: npm run test:all
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build local server image
        run: docker build -t aria-guardian-ci .
